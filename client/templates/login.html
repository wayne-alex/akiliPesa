<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — AkiliPesa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Simple Top Header Navigation -->
    <header class="w-full px-6 py-4 max-w-6xl mx-auto flex justify-between items-center">
        <a href="{% url 'index' %}"  class="text-2xl font-extrabold tracking-tight text-emerald-700">
            Akili<span class="text-slate-900">Pesa</span>
        </a>
        <a href="{% url 'index' %}" class="text-xs font-bold text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-1">
            ← Back to Home
        </a>
    </header>

    <!-- Main Authentication Layout Card -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-[400px] bg-white border border-slate-200/80 rounded-2xl shadow-xl p-6 sm:p-8">

            <!-- Header Identity -->
            <div class="text-center mb-8">
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Welcome to AkiliPesa</h1>
                <p class="text-xs text-slate-500 mt-1.5">Enter your M-Pesa registered line to access your wallet</p>
            </div>

            <!-- Form Submissions -->
            <form action="#" method="POST" class="space-y-5">

                <!-- Phone Number Entry Segment -->
                <div>
                    <label for="phone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Safcom Phone Number
                    </label>
                    <div class="relative rounded-xl shadow-xs">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <span class="text-slate-400 font-mono text-sm font-semibold">+254</span>
                        </div>
                        <input
                            type="tel"
                            name="phone"
                            id="phone"
                            required
                            placeholder="7XXXXXXXX"
                            maxlength="9"
                            pattern="[0-9]{9}"
                            class="block w-full pl-16 pr-4 py-3 border border-slate-200 rounded-xl bg-slate-50/50 text-slate-900 placeholder-slate-400 font-mono text-sm font-bold focus:outline-none focus:ring-2 focus:ring-emerald-600/20 focus:border-emerald-600 transition-all"
                        >
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1.5">Omit the leading 0 or +254 when typing.</p>
                </div>

                <!-- Account PIN Input Segment -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="pin" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                            Account Security PIN
                        </label>
                        <a href="#" class="text-xs font-semibold text-emerald-700 hover:underline">Forgot PIN?</a>
                    </div>
                    <input
                        type="password"
                        name="pin"
                        id="pin"
                        required
                        placeholder="••••"
                        maxlength="4"
                        pattern="[0-9]{4}"
                        inputmode="numeric"
                        class="block w-full px-4 py-3 border border-slate-200 rounded-xl bg-slate-50/50 text-slate-900 tracking-widest placeholder-slate-300 font-mono text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-emerald-600/20 focus:border-emerald-600 transition-all"
                    >
                </div>

                <!-- Remember State Toggle Checkbox -->
                <div class="flex items-center">
                    <input
                        id="remember-me"
                        name="remember-me"
                        type="checkbox"
                        class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500/30"
                    >
                    <label for="remember-me" class="ml-2.5 block text-xs font-semibold text-slate-600 select-none">
                        Keep me signed in on this device
                    </label>
                </div>

                <!-- Submission Action Button trigger -->
                <button
                    type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-3.5 rounded-xl transition-all shadow-md shadow-emerald-600/5 active:scale-98 cursor-pointer mt-2"
                >
                    Secure Log In
                </button>
            </form>

            <!-- Bottom Context Shift Link -->
            <div class="mt-6 pt-5 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500">
                    New to AkiliPesa?
                    <a href="{% url 'signup_user' %}" class="font-bold text-emerald-700 hover:underline ml-1">Create Account</a>
                </p>
            </div>

        </div>
    </main>

    <!-- Structural Minimal Footer -->
    <footer class="w-full bg-white border-t border-slate-200/80 py-6 text-center text-[11px] text-slate-400 font-medium">
        <div class="max-w-6xl mx-auto px-4">
            <p>© 2026 AkiliPesa Tech Ltd.</p>
        </div>
    </footer>

</body>
</html>
